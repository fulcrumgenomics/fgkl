[package]
name = "fgkl-jni"
description = "JNI bindings exposing fgkl kernels to GATK through gatk-native-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A JNI cdylib has no crates.io audience.
publish = false

[lib]
name = "fgkl"
crate-type = ["cdylib"]

[dependencies]
fgkl-pairhmm = { path = "../pairhmm", version = "0.1.0" }
fgkl-smithwaterman = { path = "../smithwaterman", version = "0.1.0" }
jni = "0.22"
