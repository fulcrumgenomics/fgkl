name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux x86_64
          - os: ubuntu-24.04-arm
            name: linux aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: Swatinem/rust-cache@v2
      - run: cargo ci-fmt
      - run: cargo ci-lint
      - run: cargo ci-test
      - run: cargo ci-doc
      - run: cargo ci-deny

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the minimum supported toolchain
        run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --workspace --all-targets --locked

  java:
    name: Java (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux x86_64
          - os: ubuntu-24.04-arm
            name: linux aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from tags
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: The sources JAR must not carry a native library
        run: |
          if unzip -l build/libs/fgkl-*-sources.jar | grep -q 'native/'; then
            echo "::error::sources JAR contains a native library"; exit 1
          fi
