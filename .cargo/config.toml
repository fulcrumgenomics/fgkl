[alias]
ci-fmt = "fmt --all -- --check"
ci-lint = "clippy --workspace --all-targets --locked -- -D warnings"
ci-test = "nextest run --workspace --locked --no-tests=pass"
# A string, not an array: cargo concatenates array config values from ancestor directories.
ci-doc = "doc --workspace --no-deps --locked --config build.rustdocflags=[\"-D\",\"warnings\"]"
ci-deny = "deny check"
