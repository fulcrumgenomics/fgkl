# cargo-deny configuration. Run locally with `cargo ci-deny`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The jni crate's build dependencies pull two windows-sys versions; not ours to fix.
skip = [{ name = "windows-sys" }, { name = "windows-targets" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
