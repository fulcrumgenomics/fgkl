[workspace]
resolver = "2"
members = ["crates/pairhmm", "crates/smithwaterman", "crates/jni"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/fulcrumgenomics/fgkl"

[profile.release]
codegen-units = 1
lto = "fat"
# The JNI entry points rely on `catch_unwind` to turn a kernel panic into a Java exception; with
# `abort` a panic would take the JVM down.
panic = "unwind"
# The shipped library carries no debug info; use the `profiling` profile for samply/perf work.
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
